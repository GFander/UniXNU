name: macOS build (darwin-xnu-build)

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        default: GFander/UniXNU-kebab
      device_ref:
        description: Device repository ref
        default: ios16
      machine_config:
        description: xnu MACHINE_CONFIG
        default: KEBAB
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796)
        default: "13.5"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

jobs:
  build:
    # Xcode 15.x: its iig matches the xnu-8796 IORPC ABI.
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          path: unixnu

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - name: Fetch darwin-xnu-build
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp unixnu/patches/xnu-8796/*.patch dxb/patches/
          echo "== patches"
          ls dxb/patches

      - name: Install host tools
        run: brew install jq gum bash cmake ninja

      - name: Build kernel
        env:
          MACOS_VERSION: ${{ inputs.macos_version }}
          MACHINE_CONFIG: ${{ inputs.machine_config }}
          KERNEL_CONFIG: ${{ inputs.kernel_config }}
        run: |
          cd dxb
          bash build.sh 2>&1 | tee build.log

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp dxb/build.log out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxb-kernel
          path: out/
          if-no-files-found: warn
