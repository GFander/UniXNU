name: macOS build (darwin-xnu-build)

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        default: GFander/UniXNU-kebab
      device_ref:
        description: Device repository ref
        default: ios16
      machine_config:
        description: xnu MACHINE_CONFIG
        default: KEBAB
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796)
        default: "13.5"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549

jobs:
  build:
    # Xcode 15.x: its iig matches the xnu-8796 IORPC ABI.
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          path: unixnu

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - name: Fetch darwin-xnu-build
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp unixnu/patches/xnu-8796/*.patch dxb/patches/
          # dxb already applies its own SDK-root and availability handling.
          rm -f dxb/patches/0001-kernel-sdk-root.patch \
                dxb/patches/0002-local-availability.patch \
                dxb/patches/0021-pid-hibernate.patch \
                dxb/patches/0022-json-compile-records.patch
          # libfirehose_kernel is built arm64e-only; our kernel is plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          echo "== patches"
          ls dxb/patches

      - name: Install host tools
        run: brew install jq gum bash cmake ninja mtools dosfstools

      - name: Build kernel
        env:
          MACOS_VERSION: ${{ inputs.macos_version }}
          MACHINE_CONFIG: ${{ inputs.machine_config }}
          KERNEL_CONFIG: ${{ inputs.kernel_config }}
          # Keep going so every failing target is reported, not just the first.
          MAKEFLAGS: "-k" 
        run: |
          cd dxb
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Dump the first errors
        if: failure()
        run: |
          echo "== install/compile failures"
          errs=$(grep -nE -B4 -m4 "error:|Error [0-9]|No rule to make" dxb/build.log | grep -vE "patch (does not apply|failed)" | head -40)
          echo "$errs"
          printf '%s' "$errs" | tail -12 | tr '\n' '|' | cut -c1-900 | sed 's/^/::error title=build::/'

      - name: Build the payload volume
        if: success()
        env:
          UNIXNU_UNIQUE_CHIP_ID: "0x1122334455667788"
        run: |
          cd unixnu
          set +e
          python3 ./unixnu defconfig kebab_defconfig --device "$GITHUB_WORKSPACE/device" > ../payload.log 2>&1
          python3 ./unixnu build payload --device "$GITHUB_WORKSPACE/device" \
            --kernel "$GITHUB_WORKSPACE/dxb/fakeroot/System/Library/Kernels/kernel.development.kebab" >> ../payload.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(tail -6 ../payload.log | tr '\n' '|' | cut -c1-800)
            echo "::error title=payload-failed::$msg"
          fi
          cat ../payload.log
          ls -la out/*/payload/ 2>/dev/null
          exit $rc

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          # payload only: 64 MiB of mostly zeros gzips to a few hundred KiB,
          # which keeps the artifact small enough to fetch over a slow link.
          cp unixnu/out/*/payload/payload.img out/ 2>/dev/null || true
          cp unixnu/out/*/payload/payload.json out/ 2>/dev/null || true
          cp payload.log out/ 2>/dev/null || true
          [ -f out/payload.img ] && gzip -9 -k out/payload.img || true
          rm -f out/payload.img
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dxb-kernel
          path: out/
          if-no-files-found: warn
